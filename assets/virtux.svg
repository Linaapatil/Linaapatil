    </circle>
    <rect width="580" height="3" fill="url(#acc)"/>
    <g transform="translate(478 26)"><g transform="translate(4 12)"><rect width="46" height="38" rx="8" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee"/><path d="M50 14l18-10v30l-18-10z" fill="#22d3ee" fill-opacity="0.3" stroke="#22d3ee"/><circle cx="12" cy="12" r="4" fill="#f87171"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle></g></g>
    <text x="28" y="48" font-size="12" font-weight="700" letter-spacing="2" fill="#22d3ee">FULL STACK · LIVE APP</text>
    <text x="28" y="86" font-size="27" font-weight="800" fill="#f1f5f9">Virtux</text>
