      <animate attributeName="r" values="80;110;80" dur="6s" repeatCount="indefinite"/>
    </circle>
    <rect width="580" height="3" fill="url(#acc)"/>
    <g transform="translate(478 26)"><rect x="0" y="40" width="12" height="20" rx="3" fill="#fbbf24"><animate attributeName="height" values="20;44;20" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="40;16;40" dur="2.4s" repeatCount="indefinite"/></rect><rect x="18" y="24" width="12" height="36" rx="3" fill="#f59e0b"><animate attributeName="height" values="36;14;36" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="24;46;24" dur="2.4s" repeatCount="indefinite"/></rect><rect x="36" y="8" width="12" height="52" rx="3" fill="#fde68a"><animate attributeName="height" values="52;30;52" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="8;30;8" dur="2.4s" repeatCount="indefinite"/></rect><rect x="54" y="30" width="12" height="30" rx="3" fill="#fbbf24"><animate attributeName="height" values="30;50;30" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="30;10;30" dur="2.4s" repeatCount="indefinite"/></rect></g>
    <text x="28" y="48" font-size="12" font-weight="700" letter-spacing="2" fill="#fbbf24">DATA · CAREER INSIGHTS</text>
