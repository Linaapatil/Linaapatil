<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#0f1d2e"/>
    </linearGradient>
    <linearGradient id="loop" x1="140" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="300" rx="24"/></clipPath>
    <path id="inf" d="M380 150 C 440 60, 600 60, 600 150 C 600 240, 440 240, 380 150 C 320 60, 160 60, 160 150 C 160 240, 320 240, 380 150 Z"/>
  </defs>

  <g clip-path="url(#frame)" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- infinity loop -->
    <use href="#inf" stroke="#ffffff" stroke-opacity="0.08" stroke-width="22"/>
    <use href="#inf" stroke="url(#loop)" stroke-width="4" stroke-dasharray="10 12" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="0;-220" dur="3s" repeatCount="indefinite"/>
    </use>
    <circle r="8" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto"><mpath href="#inf"/></animateMotion>
    </circle>
    <circle r="5" fill="#a78bfa" filter="url(#glow)">
      <animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath href="#inf"/></animateMotion>
    </circle>

    <text x="260" y="157" text-anchor="middle" font-size="26" font-weight="800" fill="#67e8f9">DEV</text>
    <text x="500" y="157" text-anchor="middle" font-size="26" font-weight="800" fill="#6ee7b7">OPS</text>

    <g font-size="13" font-weight="600" fill="#94a3b8">
      <text x="200" y="66">plan</text>
      <text x="300" y="66">code</text>
      <text x="200" y="248">test</text>
      <text x="300" y="248">build</text>
      <text x="420" y="66">release</text>
      <text x="528" y="66">deploy</text>
      <text x="420" y="248">monitor</text>
      <text x="528" y="248">operate</text>
    </g>

    <!-- right text -->
    <text x="680" y="104" font-size="32" font-weight="800" fill="#f1f5f9">Ship it, automate it, watch it.</text>
    <text x="680" y="140" font-size="17" fill="#94a3b8">Version control, CI/CD pipelines, containers and cloud deploys</text>
    <text x="680" y="164" font-size="17" fill="#94a3b8">so data products and apps go from commit to production cleanly.</text>

    <!-- terminal snippet -->
    <g transform="translate(680 188)" font-family="Consolas,'Courier New',monospace" font-size="14">
      <rect width="460" height="76" rx="12" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="16" y="28" fill="#34d399">$</text>
      <text x="32" y="28" fill="#e2e8f0">git push origin main</text>
      <text x="16" y="56" fill="#22d3ee">✓</text>
      <text x="32" y="56" fill="#94a3b8">build · test · docker · deploy</text>
      <text x="290" y="56" fill="#34d399" opacity="0">passed
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.4;.5;.9;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <rect x="290" y="44" width="9" height="16" fill="#e2e8f0">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.4;.5;.9;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="24" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
