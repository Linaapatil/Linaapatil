<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#03141f"/>
      <stop offset="0.6" stop-color="#0a1f33"/>
      <stop offset="1" stop-color="#111538"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#5eead4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-250 0;250 0;-250 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ecg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="560" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">
    <rect width="1200" height="560" fill="url(#bg)"/>
    <rect width="1200" height="560" fill="url(#grid)"/>
    <g filter="url(#blur)" opacity="0.45">
      <circle cx="1050" cy="90" r="140" fill="#0d9488"><animate attributeName="cy" values="90;170;90" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="160" cy="480" r="130" fill="#1d4ed8"><animate attributeName="cx" values="160;300;160" dur="14s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ECG heartbeat -->
    <path d="M0 120 H430 l14 -22 l12 44 l14 -76 l14 92 l12 -50 l10 12 H1200" stroke="url(#ecg)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="1400" stroke-dashoffset="1400" filter="url(#glow)" opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="1400;0;-1400" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- header -->
    <g transform="translate(60 44)">
      <rect width="168" height="30" rx="15" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.6"/>
      <circle cx="20" cy="15" r="5" fill="#2dd4bf"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="34" y="20" font-size="13" font-weight="700" letter-spacing="2" fill="#99f6e4">LATEST PROJECT</text>
    </g>
    <text x="58" y="196" font-size="56" font-weight="800" fill="url(#title)" letter-spacing="-1">MedCare HMS</text>
    <text x="60" y="232" font-size="20" fill="#cbd5e1">Hospital Management System on Salesforce for a 500-bed multi-specialty hospital</text>

    <!-- tech pills -->
    <g font-size="13" font-weight="600" transform="translate(60 254)">
      <rect width="96" height="28" rx="14" fill="#00a1e0" fill-opacity="0.18" stroke="#00a1e0" stroke-opacity="0.6"/><text x="48" y="19" text-anchor="middle" fill="#7dd3fc">Salesforce</text>
      <rect x="106" width="64" height="28" rx="14" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.6"/><text x="138" y="19" text-anchor="middle" fill="#c4b5fd">Apex</text>
      <rect x="180" width="64" height="28" rx="14" fill="#f472b6" fill-opacity="0.15" stroke="#f472b6" stroke-opacity="0.6"/><text x="212" y="19" text-anchor="middle" fill="#f9a8d4">LWC</text>
      <rect x="254" width="72" height="28" rx="14" fill="#fbbf24" fill-opacity="0.13" stroke="#fbbf24" stroke-opacity="0.6"/><text x="290" y="19" text-anchor="middle" fill="#fde68a">Flows</text>
      <rect x="336" width="116" height="28" rx="14" fill="#34d399" fill-opacity="0.13" stroke="#34d399" stroke-opacity="0.6"/><text x="394" y="19" text-anchor="middle" fill="#a7f3d0">REST + SOAP</text>
      <rect x="462" width="64" height="28" rx="14" fill="#fb7185" fill-opacity="0.13" stroke="#fb7185" stroke-opacity="0.6"/><text x="494" y="19" text-anchor="middle" fill="#fecdd3">Jest</text>
      <rect x="536" width="96" height="28" rx="14" fill="#94a3b8" fill-opacity="0.13" stroke="#94a3b8" stroke-opacity="0.6"/><text x="584" y="19" text-anchor="middle" fill="#e2e8f0">SFDX + Git</text>
    </g>

    <!-- coverage ring -->
    <g transform="translate(1010 270)">
      <circle r="78" stroke="#ffffff" stroke-opacity="0.08" stroke-width="14"/>
      <circle r="78" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="490" transform="rotate(-90)" filter="url(#glow)">
        <animate attributeName="stroke-dashoffset" values="490;15;15;490" keyTimes="0;.35;.9;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <text y="6" text-anchor="middle" font-size="40" font-weight="800" fill="#f0fdfa">97%</text>
      <text y="32" text-anchor="middle" font-size="13" letter-spacing="2" fill="#5eead4">APEX COVERAGE</text>
    </g>

    <!-- metric tiles -->
    <g transform="translate(60 312)">
      <g>
        <rect width="200" height="92" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#2dd4bf" stroke-opacity="0.35"/>
        <text x="20" y="48" font-size="34" font-weight="800" fill="#f0fdfa">75/75</text>
        <text x="20" y="74" font-size="14" fill="#94a3b8">Apex tests passing</text>
      </g>
      <g transform="translate(216 0)">
        <rect width="200" height="92" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#38bdf8" stroke-opacity="0.35"/>
        <text x="20" y="48" font-size="34" font-weight="800" fill="#f0f9ff">24/24</text>
        <text x="20" y="74" font-size="14" fill="#94a3b8">LWC Jest tests</text>
      </g>
      <g transform="translate(432 0)">
        <rect width="200" height="92" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#a78bfa" stroke-opacity="0.35"/>
        <text x="20" y="48" font-size="34" font-weight="800" fill="#f5f3ff">9 + 4</text>
        <text x="20" y="74" font-size="14" fill="#94a3b8">Custom objects + LWCs</text>
      </g>
      <g transform="translate(648 0)">
        <rect width="200" height="92" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#fbbf24" stroke-opacity="0.35"/>
        <text x="20" y="48" font-size="34" font-weight="800" fill="#fffbeb">7 Flows</text>
        <text x="20" y="74" font-size="14" fill="#94a3b8">Record, scheduled, screen</text>
      </g>
    </g>

    <!-- architecture pipeline -->
    <g transform="translate(60 448)" font-size="14" font-weight="600">
      <path d="M100 38 H1080" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
      </path>
      <circle cx="100" cy="38" r="5" fill="#5eead4" filter="url(#glow)">
        <animate attributeName="cx" values="100;980" dur="4s" repeatCount="indefinite"/>
      </circle>

      <rect x="0" y="12" width="200" height="52" rx="14" fill="#0f2b3d" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="100" y="35" text-anchor="middle" fill="#e0f2fe">Lightning UI</text>
      <text x="100" y="53" text-anchor="middle" font-size="11" font-weight="400" fill="#7dd3fc">LWC · LMS · Path</text>

      <rect x="220" y="12" width="200" height="52" rx="14" fill="#1e1b3a" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="320" y="35" text-anchor="middle" fill="#ede9fe">Apex Services</text>
      <text x="320" y="53" text-anchor="middle" font-size="11" font-weight="400" fill="#c4b5fd">Triggers · Handlers</text>

      <rect x="440" y="12" width="200" height="52" rx="14" fill="#2a2412" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="540" y="35" text-anchor="middle" fill="#fef3c7">Automation</text>
      <text x="540" y="53" text-anchor="middle" font-size="11" font-weight="400" fill="#fde68a">Flows · Approvals · Batch</text>

      <rect x="660" y="12" width="200" height="52" rx="14" fill="#0d2a26" stroke="#2dd4bf" stroke-opacity="0.6"/>
      <text x="760" y="35" text-anchor="middle" fill="#ccfbf1">Secure Data</text>
      <text x="760" y="53" text-anchor="middle" font-size="11" font-weight="400" fill="#5eead4">OWD · Sharing · FLS</text>

      <rect x="880" y="12" width="200" height="52" rx="14" fill="#2a1220" stroke="#f472b6" stroke-opacity="0.6"/>
      <text x="980" y="35" text-anchor="middle" fill="#fce7f3">Integrations</text>
      <text x="980" y="53" text-anchor="middle" font-size="11" font-weight="400" fill="#f9a8d4">Lab REST · Insurance SOAP</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="24" stroke="#2dd4bf" stroke-opacity="0.25"/>
</svg>
