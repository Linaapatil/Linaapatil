<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="580" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="580" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-580 0;580 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="frame"><rect width="580" height="240" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">
    <rect width="580" height="240" fill="url(#bg)"/>
    <circle cx="520" cy="40" r="90" fill="#a78bfa" opacity="0.28" filter="url(#blur)">
      <animate attributeName="r" values="80;110;80" dur="6s" repeatCount="indefinite"/>
    </circle>
    <rect width="580" height="3" fill="url(#acc)"/>
    <g transform="translate(478 26)"><g transform="translate(34 32)"><circle r="26" stroke="#ffffff" stroke-opacity="0.1" stroke-width="9"/><circle r="26" stroke="#f472b6" stroke-width="9" stroke-dasharray="60 104" transform="rotate(-90)"><animateTransform attributeName="transform" type="rotate" values="-90;270" dur="5s" repeatCount="indefinite"/></circle><circle r="26" stroke="#a78bfa" stroke-width="9" stroke-dasharray="40 124" stroke-dashoffset="-64" transform="rotate(-90)"><animateTransform attributeName="transform" type="rotate" values="-90;270" dur="5s" repeatCount="indefinite"/></circle></g></g>
    <text x="28" y="48" font-size="12" font-weight="700" letter-spacing="2" fill="#f472b6">RETAIL · END-TO-END EDA</text>
    <text x="28" y="86" font-size="27" font-weight="800" fill="#f1f5f9">Customer Behavior Analysis</text>
    <text x="28" y="122" font-size="15" fill="#94a3b8">Cleaning, EDA and SQL business queries on shopping</text>
    <text x="28" y="144" font-size="15" fill="#94a3b8">data, finished with an interactive Power BI dashboard.</text>
    <g transform="translate(0 180)" font-size="12" font-weight="600" fill="#e2e8f0"><rect x="28" y="0" width="74" height="26" rx="13" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.5"/><text x="65" y="17.5" text-anchor="middle">Python</text><rect x="110" y="0" width="74" height="26" rx="13" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.5"/><text x="147" y="17.5" text-anchor="middle">Pandas</text><rect x="192" y="0" width="50" height="26" rx="13" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.5"/><text x="217" y="17.5" text-anchor="middle">SQL</text><rect x="250" y="0" width="90" height="26" rx="13" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.5"/><text x="295" y="17.5" text-anchor="middle">Power BI</text></g>
  </g>
  <rect x="0.5" y="0.5" width="579" height="239" rx="20" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
